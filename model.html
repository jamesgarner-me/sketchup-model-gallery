<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Model viewer</title>
  </head>
  <body>
    <div class="viewer">
      <div id="stage" class="stage"></div>

      <header class="topbar">
        <a class="btn btn-icon" id="back" href="/" aria-label="Gallery" title="Back to gallery">
          <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9v11h5v-6h4v6h5V9" />
          </svg>
        </a>
        <h1 id="title"></h1>
      </header>

      <div id="loading" class="loading" role="progressbar" aria-label="Loading model" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill" id="loading-fill"></div>
      </div>

      <section id="error" class="state" role="alert" hidden>
        <p>This model couldn't be loaded. Check your connection and try again.</p>
        <div class="state-actions">
          <button class="btn" id="retry" type="button">Retry</button>
          <a class="btn" href="/">Back to Gallery</a>
        </div>
      </section>

      <section id="notfound" class="state" hidden>
        <h2>Model not found</h2>
        <p>We couldn't find that model.</p>
        <div class="state-actions"><a class="btn" href="/">Back to Gallery</a></div>
      </section>

      <footer class="controls" id="controls">
        <div class="controls-row">
          <button class="btn" id="reset" type="button">Reset view</button>
          <button class="btn" id="viewpoints-btn" type="button" aria-expanded="false" aria-controls="viewpoints" hidden>Viewpoints</button>
          <button class="btn" id="layers-btn" type="button" aria-expanded="false" aria-controls="layers" hidden>Layers</button>
          <span id="info-slot"><button class="btn" id="info-btn" type="button" aria-haspopup="dialog">Info</button></span>
        </div>
      </footer>

      <aside id="viewpoints" class="drawer" aria-labelledby="viewpoints-title" hidden>
        <div class="drawer-bar">
          <h2 id="viewpoints-title">Viewpoints</h2>
          <button class="btn" id="viewpoints-close" type="button">Close</button>
        </div>
        <ul id="viewpoints-list" class="drawer-list"></ul>
      </aside>

      <section id="layers" class="drawer layers-panel" aria-labelledby="layers-title" hidden>
        <div class="drawer-bar">
          <h2 id="layers-title">Layers</h2>
          <button class="btn" id="layers-close" type="button">Close</button>
        </div>
        <ul id="layers-list" class="drawer-list"></ul>
        <div class="drawer-foot"><button class="btn" id="layers-restore" type="button">Restore defaults</button></div>
      </section>
    </div>
    <dialog id="info" class="info" aria-labelledby="info-title">
      <div class="info-scroll">
        <div class="info-bar">
          <button class="btn" id="info-close" type="button" autofocus>Close</button>
        </div>
        <article class="info-inner">
          <h2 id="info-title"></h2>
          <p class="info-desc" id="info-desc"></p>
          <section id="info-notes" class="prose" hidden></section>
        </article>
      </div>
    </dialog>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
