<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Model viewer</title>
  </head>
  <body>
    <div class="viewer">
      <div id="stage" class="stage"></div>

      <header class="topbar">
        <a class="btn" id="back" href="/">&larr; Gallery</a>
        <h1 id="title"></h1>
      </header>

      <div id="loading" class="loading" role="progressbar" aria-label="Loading model" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill" id="loading-fill"></div>
      </div>

      <section id="error" class="state" role="alert" hidden>
        <p>This model couldn't be loaded. Check your connection and try again.</p>
        <div class="state-actions">
          <button class="btn" id="retry" type="button">Retry</button>
          <a class="btn" href="/">Back to Gallery</a>
        </div>
      </section>

      <section id="notfound" class="state" hidden>
        <h2>Model not found</h2>
        <p>We couldn't find that model.</p>
        <div class="state-actions"><a class="btn" href="/">Back to Gallery</a></div>
      </section>

      <footer class="controls" id="controls">
        <div class="controls-row">
          <button class="btn" id="reset" type="button">Reset view</button>
          <span id="info-slot"><button class="btn" id="info-btn" type="button" aria-haspopup="dialog">Info</button></span>
        </div>
      </footer>
    </div>
    <dialog id="info" class="info" aria-labelledby="info-title">
      <div class="info-scroll">
        <div class="info-bar">
          <button class="btn" id="info-close" type="button" autofocus>Close</button>
        </div>
        <article class="info-inner">
          <h2 id="info-title"></h2>
          <p class="info-desc" id="info-desc"></p>
          <section id="info-notes" class="prose" hidden></section>
        </article>
      </div>
    </dialog>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
