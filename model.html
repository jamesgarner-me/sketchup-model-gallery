<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Model viewer (spike)</title>
    <style>
      html, body { margin: 0; height: 100%; overscroll-behavior: none; }
      model-viewer { width: 100%; height: 100dvh; background: #eceff1; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- Spike: hardcoded path; replace with the owner's export. -->
    <model-viewer
      src="/models/stairs-james-design-v1-backup.glb"
      alt="Stairs design"
      camera-controls
      touch-action="none"
      shadow-intensity="0.6"
      exposure="1"
    ></model-viewer>
    <script type="module" src="/src/model.ts"></script>
  </body>
</html>
